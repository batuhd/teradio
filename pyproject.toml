[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teradio"
version = "0.1.0"
description = "Terminalde çalışan internet radyosu (ncspot tarzı)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teradio" }]
keywords = ["radio", "tui", "terminal", "textual", "mpv"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
teradio = "teradio.app:main"

[project.urls]
Homepage = "https://github.com/USER/teradio"

[tool.hatch.build.targets.wheel]
packages = ["teradio"]
